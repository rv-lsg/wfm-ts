<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>WFM CRM — Ticketing & Approvals</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#060B16; --panel:rgba(17,27,46,.62); --panel-solid:#111B2E; --panel-2:rgba(10,18,33,.7);
    --line:rgba(78,201,245,.16); --line-soft:rgba(138,160,189,.14);
    --red:#E23744; --cyan:#4EC9F5; --green:#3FCE8B; --amber:#F5B94E; --violet:#8B7CF6;
    --txt:#EAF2FB; --muted:#8FA6C4; --muted-2:#5E7392;
    --accent:#E23744;
    --disp:'Space Grotesk',Arial,sans-serif;
    --brandf:'Orbitron','Space Grotesk',sans-serif;
    --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
    --code:'JetBrains Mono','Courier New',monospace;
    --sans:'Space Grotesk',Arial,Helvetica,system-ui,sans-serif;
    --r:14px; --glow-c:0 0 18px rgba(78,201,245,.25);
    --inset-bg:rgba(6,11,22,.5);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--txt);font-family:var(--sans);font-size:14px;line-height:1.45;overflow-x:hidden}
  a{color:var(--cyan)}
  button{font-family:var(--sans);cursor:pointer}
  ::placeholder{color:var(--muted-2)}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:rgba(78,201,245,.25);border-radius:10px}
  ::-webkit-scrollbar-track{background:transparent}
  .mono{font-family:var(--mono)}
  .code{font-family:var(--code);letter-spacing:.08em;text-transform:uppercase;font-size:11px}
  .hide{display:none !important}

  /* ---- ambient futuristic backdrop ---- */
  .bg-aurora{position:fixed;inset:0;z-index:-4;overflow:hidden;background:var(--bg)}
  .bg-aurora::before,.bg-aurora::after{content:"";position:absolute;border-radius:50%;filter:blur(90px);opacity:.5;mix-blend-mode:screen}
  .bg-aurora::before{width:60vw;height:60vw;left:-10vw;top:-20vh;background:radial-gradient(circle,rgba(226,55,68,.55),transparent 60%);animation:drift1 22s ease-in-out infinite}
  .bg-aurora::after{width:55vw;height:55vw;right:-12vw;bottom:-18vh;background:radial-gradient(circle,rgba(78,201,245,.5),transparent 60%);animation:drift2 26s ease-in-out infinite}
  .bg-grid{position:fixed;inset:0;z-index:-3;
    background-image:linear-gradient(rgba(78,201,245,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(78,201,245,.05) 1px,transparent 1px);
    background-size:44px 44px;mask-image:radial-gradient(circle at 50% 30%,#000 30%,transparent 85%)}
  .bg-scan{position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.35;
    background:repeating-linear-gradient(to bottom,transparent 0 3px,rgba(0,0,0,.16) 3px 4px)}
  @keyframes drift1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(6vw,4vh) scale(1.12)}}
  @keyframes drift2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-5vw,-3vh) scale(1.1)}}

  /* ---- form controls ---- */
  .field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
  .field label{font-family:var(--code);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  input,select,textarea{background:rgba(6,11,22,.75);border:1px solid var(--line);color:var(--txt);
    border-radius:9px;padding:10px 12px;font-size:14px;outline:none;width:100%;transition:.18s;font-family:var(--sans)}
  input:focus,select:focus,textarea:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(78,201,245,.16),var(--glow-c)}
  textarea{resize:vertical;min-height:90px}
  select option{background:#0b1424}
  .btn{position:relative;border:1px solid var(--line);background:rgba(17,27,46,.55);color:var(--txt);border-radius:9px;
    padding:10px 16px;font-size:13px;font-weight:600;transition:.18s;letter-spacing:.02em;overflow:hidden}
  .btn:hover{border-color:var(--cyan);box-shadow:var(--glow-c);transform:translateY(-1px)}
  .btn.primary{background:linear-gradient(135deg,var(--accent),#b8232f);border-color:transparent;color:#fff}
  .btn.primary:hover{box-shadow:0 0 22px rgba(226,55,68,.45);filter:brightness(1.06)}
  .btn.green{background:linear-gradient(135deg,var(--green),#26a56a);border-color:transparent;color:#042313}
  .btn.green:hover{box-shadow:0 0 20px rgba(63,206,139,.4)}
  .btn.danger{background:transparent;border-color:rgba(226,55,68,.5);color:var(--red)}
  .btn.danger:hover{background:var(--red);color:#fff;box-shadow:0 0 20px rgba(226,55,68,.4)}
  .btn.ghost{background:transparent}
  .btn.sm{padding:6px 12px;font-size:12px}
  .btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
  :focus-visible{outline:2px solid var(--cyan);outline-offset:2px}

  /* ---- layout ---- */
  #app{min-height:100vh;display:flex;flex-direction:column}
  .topbar{display:flex;align-items:center;gap:14px;padding:12px 22px;
    background:rgba(9,15,28,.72);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:200;overflow:visible}
  .brand{display:flex;align-items:center;gap:11px;font-family:var(--brandf);font-weight:700;letter-spacing:.06em}
  .brand .orb{width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,var(--accent) 60%);
    box-shadow:0 0 14px var(--accent),0 0 4px #fff;position:relative}
  .brand .orb::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:1px solid var(--accent);opacity:.5;animation:ring 2.6s ease-out infinite}
  @keyframes ring{0%{transform:scale(.7);opacity:.7}100%{transform:scale(1.9);opacity:0}}
  .brand small{display:block;font-family:var(--code);font-size:8px;color:var(--muted);letter-spacing:.24em;margin-top:2px}
  .topbar .spacer{flex:1}
  .whoami{display:flex;flex-direction:column;align-items:flex-end;line-height:1.2}
  .whoami b{font-size:13px;font-family:var(--disp)}
  .whoami span{font-family:var(--code);font-size:10px;color:var(--muted);letter-spacing:.08em}
  .backend-chip{font-family:var(--code);font-size:10px;letter-spacing:.08em;padding:4px 9px;border-radius:20px;border:1px solid var(--line)}
  .backend-chip.local{color:var(--amber);border-color:rgba(245,185,78,.4)}
  .backend-chip.firebase{color:var(--green);border-color:rgba(63,206,139,.4)}

  .nav{display:flex;gap:4px;padding:0 22px;background:rgba(6,11,22,.55);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);overflow-x:auto}
  .nav button{background:transparent;border:none;color:var(--muted);padding:14px 16px;font-size:13px;font-weight:600;border-bottom:2px solid transparent;white-space:nowrap;font-family:var(--disp)}
  .nav button.active{color:var(--txt);border-bottom-color:var(--accent);text-shadow:0 0 12px rgba(226,55,68,.5)}
  .nav button:hover{color:var(--txt)}

  .wrap{max-width:1200px;width:100%;margin:0 auto;padding:24px 20px 90px}
  .grid{display:grid;gap:16px}
  .cards{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
  .card{background:var(--panel);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:var(--r);padding:16px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.04);transition:.2s;animation:rise .5s both}
  .card:hover{transform:translateY(-3px);border-color:rgba(78,201,245,.4);box-shadow:0 10px 40px rgba(0,0,0,.4),var(--glow-c)}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
  .kpi{position:relative;overflow:hidden}
  .kpi .n{font-family:var(--brandf);font-size:34px;font-weight:700;line-height:1}
  .kpi .l{font-family:var(--code);font-size:10px;color:var(--muted);letter-spacing:.12em;margin-top:8px}
  .kpi.red .n{color:var(--red);text-shadow:0 0 20px rgba(226,55,68,.5)}
  .kpi.cyan .n{color:var(--cyan);text-shadow:0 0 20px rgba(78,201,245,.5)}
  .kpi.green .n{color:var(--green);text-shadow:0 0 20px rgba(63,206,139,.5)}
  .kpi.amber .n{color:var(--amber);text-shadow:0 0 20px rgba(245,185,78,.5)}
  .kpi::after{content:"";position:absolute;right:-30px;top:-30px;width:90px;height:90px;border-radius:50%;
    background:radial-gradient(circle,currentColor,transparent 70%);opacity:.06}

  .section-h{display:flex;align-items:center;gap:12px;margin:28px 0 12px}
  .section-h h2{margin:0;font-size:16px;letter-spacing:.02em;font-family:var(--disp);font-weight:600}
  .section-h .rule{flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}

  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:12px;border-bottom:1px solid var(--line-soft);vertical-align:top}
  th{font-family:var(--code);font-size:10px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
  tr:hover td{background:rgba(78,201,245,.04)}
  .table-wrap{background:var(--panel);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}

  .badge{display:inline-block;font-family:var(--code);font-size:10px;letter-spacing:.06em;padding:3px 9px;border-radius:20px;border:1px solid var(--line);text-transform:uppercase}
  .b-pending{color:var(--amber);border-color:rgba(245,185,78,.45);background:rgba(245,185,78,.06)}
  .b-approved{color:var(--green);border-color:rgba(63,206,139,.45);background:rgba(63,206,139,.06)}
  .b-rejected{color:var(--red);border-color:rgba(226,55,68,.45);background:rgba(226,55,68,.06)}
  .b-cancelled{color:var(--muted);border-color:var(--line)}
  .prio-High{color:var(--red)} .prio-Urgent{color:#fff;background:var(--red);border-color:var(--red)}
  .prio-Medium{color:var(--amber)} .prio-Low{color:var(--cyan)}

  .pips{display:flex;gap:5px;align-items:center}
  .pip{width:22px;height:6px;border-radius:3px;background:var(--line-soft)}
  .pip.done{background:var(--green);box-shadow:0 0 8px rgba(63,206,139,.6)}
  .pip.at{background:var(--amber);box-shadow:0 0 8px rgba(245,185,78,.6);animation:pulseb 1.4s infinite}
  .pip.rej{background:var(--red);box-shadow:0 0 8px rgba(226,55,68,.6)}
  @keyframes pulseb{0%,100%{opacity:1}50%{opacity:.4}}

  .overlay{position:fixed;inset:0;background:rgba(3,6,12,.72);backdrop-filter:blur(4px);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:60;overflow:auto;animation:fade .2s}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .modal{background:rgba(14,22,40,.92);backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:18px;width:100%;max-width:640px;padding:24px;
    box-shadow:0 20px 70px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.05);animation:rise .3s}
  .modal h3{margin:0 0 4px;font-family:var(--disp)}
  .modal .sub{color:var(--muted);font-size:12px;margin-bottom:16px}
  .modal-foot{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
  .close-x{background:transparent;border:none;color:var(--muted);font-size:20px;line-height:1}

  .auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .auth-card{width:100%;max-width:410px;background:var(--panel);backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:20px;padding:32px;
    box-shadow:0 20px 80px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.06);animation:rise .5s}
  .auth-card .brand{justify-content:center;margin-bottom:6px;font-size:21px}
  .auth-sub{text-align:center;color:var(--muted);font-size:11px;margin-bottom:22px;font-family:var(--code);letter-spacing:.16em}
  .auth-tabs{display:flex;gap:6px;margin-bottom:18px}
  .auth-tabs button{flex:1;background:rgba(6,11,22,.6);border:1px solid var(--line);color:var(--muted);padding:9px;border-radius:9px;font-weight:600;font-size:12px}
  .auth-tabs button.active{color:var(--txt);border-color:var(--accent);box-shadow:0 0 16px rgba(226,55,68,.25)}
  .seed-note{margin-top:16px;font-size:11px;color:var(--muted);background:rgba(6,11,22,.5);border:1px dashed var(--line);border-radius:9px;padding:10px 12px;line-height:1.55}
  .seed-note b{color:var(--cyan)}

  .msg{border-radius:9px;padding:10px 12px;font-size:12px;margin-bottom:14px;border:1px solid}
  .msg.err{color:var(--red);border-color:rgba(226,55,68,.4);background:rgba(226,55,68,.08)}
  .msg.ok{color:var(--green);border-color:rgba(63,206,139,.4);background:rgba(63,206,139,.08)}

  .chip-row{display:flex;flex-wrap:wrap;gap:6px}
  .chip{background:rgba(6,11,22,.6);border:1px solid var(--line);border-radius:20px;padding:5px 10px;font-size:12px;display:flex;align-items:center;gap:6px}
  .chip button{background:transparent;border:none;color:var(--muted);font-size:14px;line-height:1}
  .row-2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
  .empty{padding:40px;text-align:center;color:var(--muted)}
  .toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:rgba(14,22,40,.95);border:1px solid var(--accent);color:var(--txt);
    padding:12px 18px;border-radius:12px;z-index:90;box-shadow:0 8px 34px rgba(0,0,0,.55),0 0 20px rgba(226,55,68,.3);animation:rise .3s}
  .muted{color:var(--muted)}
  .timeline{border-left:2px solid var(--line);margin-left:6px;padding-left:16px}
  .tl-item{margin-bottom:14px;position:relative}
  .tl-item::before{content:"";position:absolute;left:-23px;top:3px;width:11px;height:11px;border-radius:50%;background:var(--muted-2);border:2px solid var(--bg)}
  .tl-item.approved::before{background:var(--green);box-shadow:0 0 10px rgba(63,206,139,.7)}
  .tl-item.rejected::before{background:var(--red);box-shadow:0 0 10px rgba(226,55,68,.7)}
  .tl-item.at::before{background:var(--amber);box-shadow:0 0 10px rgba(245,185,78,.7);animation:pulseb 1.4s infinite}
  .tl-item small{color:var(--muted);font-family:var(--code);font-size:10px}
  .approver-name{color:var(--cyan);font-weight:600}

  /* ---- chatbot ---- */
  #chat-launch{position:fixed;right:22px;bottom:22px;z-index:70;width:62px;height:62px;border-radius:50%;border:none;
    background:radial-gradient(circle at 34% 30%,#fff2,transparent 40%),linear-gradient(135deg,var(--accent),var(--cyan));
    box-shadow:0 8px 30px rgba(0,0,0,.5),0 0 26px rgba(78,201,245,.45);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.2s}
  #chat-launch:hover{transform:scale(1.07) translateY(-2px)}
  #chat-launch::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:1.5px solid var(--cyan);opacity:.6;animation:ring 2.4s ease-out infinite}
  #chat-launch .ico{font-family:var(--brandf);font-weight:900;font-size:18px;color:#fff;letter-spacing:.02em;text-shadow:0 1px 4px rgba(0,0,0,.4)}
  #chat-panel{position:fixed;right:22px;bottom:96px;z-index:71;width:380px;max-width:calc(100vw - 32px);height:520px;max-height:calc(100vh - 130px);
    background:rgba(11,18,34,.9);backdrop-filter:blur(20px);border:1px solid var(--line);border-radius:18px;
    box-shadow:0 24px 80px rgba(0,0,0,.6),0 0 30px rgba(78,201,245,.15);display:flex;flex-direction:column;overflow:hidden;animation:rise .25s;transform-origin:bottom right}
  #chat-panel .ch-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);background:rgba(6,11,22,.5)}
  #chat-panel .ch-head .orb{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 34% 30%,#fff,var(--cyan) 55%);box-shadow:0 0 12px var(--cyan)}
  #chat-panel .ch-head b{font-family:var(--brandf);letter-spacing:.06em;font-size:14px}
  #chat-panel .ch-head small{display:block;font-family:var(--code);font-size:9px;color:var(--muted);letter-spacing:.12em}
  #chat-panel .ch-head .sp{flex:1}
  #chat-panel .ch-head button{background:transparent;border:none;color:var(--muted);font-size:16px;padding:4px 6px}
  .ch-body{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
  .ch-msg{max-width:84%;padding:10px 13px;border-radius:14px;font-size:13px;line-height:1.5;white-space:pre-wrap;animation:rise .25s}
  .ch-msg.bot{align-self:flex-start;background:rgba(78,201,245,.1);border:1px solid rgba(78,201,245,.25);border-bottom-left-radius:4px}
  .ch-msg.me{align-self:flex-end;background:linear-gradient(135deg,rgba(226,55,68,.28),rgba(226,55,68,.14));border:1px solid rgba(226,55,68,.35);border-bottom-right-radius:4px}
  .ch-typing{align-self:flex-start;color:var(--muted);font-size:12px;font-family:var(--code)}
  .ch-quick{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 8px}
  .ch-quick button{font-size:11px;padding:5px 9px;border-radius:16px;border:1px solid var(--line);background:rgba(6,11,22,.5);color:var(--cyan)}
  .ch-quick button:hover{border-color:var(--cyan)}
  .ch-input{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line);background:rgba(6,11,22,.4)}
  .ch-input input{border-radius:20px}
  .ch-input button{border-radius:20px;padding:0 16px}
  .ch-cfg{padding:12px 16px;border-top:1px solid var(--line);background:rgba(6,11,22,.4);font-size:12px}

  .card.inset{background:var(--inset-bg)}

  /* ============ JIRA-LIKE COMPONENTS ============ */
  .board{display:flex;gap:12px;overflow-x:auto;padding-bottom:12px}
  .col{flex:0 0 240px;background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:10px;min-height:120px}
  .col h4{margin:0 0 10px;font-family:var(--code);font-size:10px;letter-spacing:.1em;color:var(--muted);display:flex;justify-content:space-between}
  .col h4 .cnt{background:rgba(78,201,245,.12);color:var(--cyan);border-radius:20px;padding:1px 8px}
  .tcard{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px;margin-bottom:9px;cursor:pointer;transition:.15s}
  .tcard:hover{border-color:var(--cyan);box-shadow:var(--glow-c);transform:translateY(-2px)}
  .tcard[draggable=true]{cursor:grab}
  .tcard.dragging{opacity:.45;cursor:grabbing}
  .col.drop-over{border-color:var(--cyan);background:rgba(78,201,245,.07)}
  .overdue{color:var(--accent);font-weight:700}
  .board-hint{font-size:11px;color:var(--muted)}
  .board.vert{flex-direction:column;overflow:visible;gap:10px}
  .board.vert .col{flex:none;width:100%}
  .board.vert .col-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:9px}
  .board.vert .tcard{margin-bottom:0}
  .tcard .k{font-family:var(--mono);font-size:10px;color:var(--cyan)}
  .tcard .s{font-size:13px;margin:4px 0 8px;font-weight:600}
  .tcard .foot{display:flex;align-items:center;justify-content:space-between}
  .avatar{width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--cyan));display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;font-family:var(--brandf)}
  .lbl{display:inline-block;font-size:10px;padding:2px 7px;border-radius:5px;background:rgba(139,124,246,.14);color:var(--violet);border:1px solid rgba(139,124,246,.3);margin:2px 2px 0 0}
  .mtabs{display:flex;gap:4px;margin:10px 0 12px;border-bottom:1px solid var(--line)}
  .mtabs button{background:transparent;border:none;color:var(--muted);padding:8px 12px;font-size:12px;font-weight:600;border-bottom:2px solid transparent}
  .mtabs button.active{color:var(--txt);border-bottom-color:var(--accent)}
  .attach{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:9px;margin-bottom:8px;background:var(--inset-bg)}
  .attach .ext{width:34px;height:34px;border-radius:7px;background:rgba(78,201,245,.14);color:var(--cyan);display:flex;align-items:center;justify-content:center;font-family:var(--code);font-size:10px;font-weight:700}
  .attach .meta{flex:1;min-width:0}
  .attach .meta b{font-size:13px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .attach .meta small{color:var(--muted);font-size:11px}
  .analysis{background:var(--inset-bg);border:1px dashed var(--line);border-radius:9px;padding:10px 12px;margin-top:6px;font-size:12px}
  .analysis .h{font-family:var(--code);font-size:10px;color:var(--cyan);letter-spacing:.08em;margin-bottom:6px}

/* ============================ ROUTING / APPROVAL ENGINE (pure) ============================ */
function requiredApprovers(cat,type){ const m=matrixFor(cat,type); return m?m.approvers.slice():[]; }
function canRequest(role,cat,type){ if(role==="admin"||role==="agent") return true; const m=matrixFor(cat,type); if(!m) return true; return m.perm[role]===undefined || m.perm[role]!=="none"; }
function permNote(role,cat,type){ const m=matrixFor(cat,type); if(!m||role==="admin"||role==="agent") return ""; return m.perm[role]==="cond"?"Conditional for your role — may need higher sign-off.":""; }
function buildApprovals(cat,type){ return requiredApprovers(cat,type).map(r=>({role:r,decision:"",by:"",byName:"",at:"",note:""})); }
function initialStatus(cat,type){ return requiredApprovers(cat,type).length ? "pending_approval" : "assigned"; }
// Who may act on the approval gate now?
function canApprove(user,t){
  if(t.status!=="pending_approval") return false;
  if(user.role==="admin") return true;
  return t.approvals.some(a=>a.decision==="" && a.role===user.role);
}
// Apply an approval decision by the given user (admin acts for the next pending role).
function applyApproval(t,user,decision,note){
  let a;
  if(user.role==="admin") a = t.approvals.find(x=>x.decision==="");
  else a = t.approvals.find(x=>x.decision==="" && x.role===user.role);
  if(!a) return t;
  a.decision=decision; a.by=user.id; a.byName=user.displayName; a.at=now(); a.note=note||"";
  if(decision==="rejected"){ t.status="rejected"; }
  else if(t.approvals.every(x=>x.decision==="approved")){ t.status="assigned"; }
  t.updatedAt=now(); return t;
}
// Status transitions a user may set from the current status.
function allowedTransitions(user,t){
  if(user.role==="admin") return Object.keys(STATUS).filter(s=>s!==t.status);
  const isApprover=APPROVER_ROLES.includes(user.role), isAssignee=t.assigneeId===user.id, isRequester=t.requesterId===user.id;
  const S=t.status; const out=[];
  if((isApprover||isAssignee)){
    if(S==="assigned") out.push("in_progress","escalated","pending_requester");
    if(S==="in_progress") out.push("resolved","escalated","pending_requester");
    if(S==="pending_requester") out.push("in_progress");
    if(S==="escalated") out.push("in_progress");
    if(S==="resolved") out.push("closed","in_progress");
  }
  if(isRequester){ if(S==="resolved") out.push("closed"); if(["new","triage","pending_approval"].includes(S)) out.push("cancelled"); }
  return [...new Set(out)];
}

function suggestDept(text){ const t=(text||"").toLowerCase(); for(const h of DEPT_HINTS){ if(h.kw.some(k=>t.includes(k))) return h.dept; } return ""; }
async function analyzeFile(file){
  const name=file.name.toLowerCase(); const out={kind:"file", note:""};
  try{
    if(/\.(xlsx|xls|csv)$/.test(name)){
      const XLSX=await import("https://cdn.sheetjs.com/xlsx-latest/package/xlsx.mjs");
      const buf=await file.arrayBuffer(); const wb=XLSX.read(buf,{type:"array"});
      out.kind="spreadsheet"; out.sheets=wb.SheetNames.map(sn=>{
        const ws=wb.Sheets[sn]; const json=XLSX.utils.sheet_to_json(ws,{header:1,blankrows:false});
        const rows=json.length; const headers=(json[0]||[]).slice(0,10).map(String);
        const cols=json.reduce((m,r)=>Math.max(m,r.length),0);
        return {name:sn,rows,cols,headers};
      });
      const allText=file.name+" "+out.sheets.map(s=>s.name+" "+s.headers.join(" ")).join(" ");
      out.suggestedDept=suggestDept(allText);
    } else if(file.type.startsWith("image/")){ out.kind="image"; }
    else if(/\.(txt|log|json)$/.test(name)){ out.kind="text"; const txt=await file.text(); out.lines=txt.split(/\r?\n/).length; out.suggestedDept=suggestDept(file.name); }
    else { out.suggestedDept=suggestDept(file.name); }
  }catch(e){ out.note="Could not analyze this file in-browser."; }
  if(!out.suggestedDept) out.suggestedDept=suggestDept(file.name);
  return out;
}

function initParticles(){ const c=document.getElementById("fx-particles"); if(!c)return; const ctx=c.getContext("2d");const DPR=Math.min(2,window.devicePixelRatio||1);const reduce=reduceMotion();let w,h,pts,raf;
  const resize=()=>{w=c.width=innerWidth*DPR;h=c.height=innerHeight*DPR;c.style.width=innerWidth+"px";c.style.height=innerHeight+"px";const n=Math.min(84,Math.floor(innerWidth/20));pts=Array.from({length:n},()=>({x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-.5)*.16*DPR,vy:(Math.random()-.5)*.16*DPR,r:Math.random()<.12}));};
  const draw=()=>{ctx.clearRect(0,0,w,h);for(const p of pts){p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>w)p.vx*=-1;if(p.y<0||p.y>h)p.vy*=-1;}const max=118*DPR;for(let i=0;i<pts.length;i++)for(let j=i+1;j<pts.length;j++){const a=pts[i],b=pts[j],d=Math.hypot(a.x-b.x,a.y-b.y);if(d<max){ctx.strokeStyle="rgba(78,201,245,"+(0.15*(1-d/max)).toFixed(3)+")";ctx.lineWidth=DPR*0.6;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();}}for(const p of pts){ctx.fillStyle=p.r?"rgba(226,55,68,.6)":"rgba(78,201,245,.5)";ctx.beginPath();ctx.arc(p.x,p.y,DPR*1.3,0,7);ctx.fill();}if(!reduce)raf=requestAnimationFrame(draw);};
  resize();draw();let to;addEventListener("resize",()=>{clearTimeout(to);to=setTimeout(()=>{cancelAnimationFrame(raf);resize();draw();},150);}); }

  kpi_total:{label:"Total tickets",size:"kpi",render:(b,c)=>kpiNum(b,c.vis,"var(--cyan)")},
  kpi_open:{label:"Open",size:"kpi",render:(b,c)=>kpiNum(b,c.open,"var(--amber)")},
  kpi_closed:{label:"Closed",size:"kpi",render:(b,c)=>kpiNum(b,c.closed,"var(--green)")},

  chart_category:{label:"By category",size:"chart",render:(b,c)=>barList(b,cats().map(k=>({label:k,value:c.vis.filter(t=>t.category===k).length,color:"var(--violet)"})),(p)=>drillModal("Category · "+p.label,c.vis.filter(t=>t.category===p.label)))},
  chart_priority:{label:"Open by priority",size:"chart",render:(b,c)=>{const pr=state.settings.priorities||["Low","Medium","High","Urgent"];b.innerHTML=donut(pr.map(p=>({label:p,value:c.open.filter(t=>t.priority===p).length,color:PRIO_COLOR[p]||"#8B7CF6"})));}},
  chart_trend:{label:"Volume · last 7 days",size:"chart",render:(b,c)=>{const days=[...Array(7)].map((_,i)=>new Date(Date.now()-(6-i)*86400e3));b.innerHTML=lineChart(days.map(d=>c.vis.filter(t=>new Date(t.createdAt).toDateString()===d.toDateString()).length),days.map(d=>d.toLocaleDateString(undefined,{weekday:"short"})));}},

const WIDGET_ORDER=["kpi_total","kpi_open","kpi_closed","kpi_pending","kpi_overdue","kpi_myqueue","chart_status","chart_dept","chart_category","chart_priority","chart_trend","chart_sla","table_recent","table_overdue","table_myqueue"];
function defaultDashboards(){ return [
  {id:"d_overview",name:"Overview",widgets:["kpi_total","kpi_open","kpi_pending","kpi_overdue","chart_status","chart_dept","chart_trend","table_recent"]},
  {id:"d_sla",name:"SLA & Aging",widgets:["kpi_overdue","kpi_pending","chart_sla","chart_priority","table_overdue"]}
]; }
function loadDashboards(){ const d=readLS("crm_dashboards",null); return (d&&d.length)?d:defaultDashboards(); }
function saveDashboards(list){ writeLS("crm_dashboards",list); }

async function viewDashboard(root){
  root.innerHTML=`<div class="empty">Loading…</div>`;
  const all=await db.listTickets(), u=state.user, vis=visibleTickets(all,u);
  const ctx={ all, vis, u,
    open:vis.filter(t=>!["closed","cancelled","rejected"].includes(t.status)),
    closed:vis.filter(t=>t.status==="closed"),
    pending:vis.filter(t=>t.status==="pending_approval"),
    overdue:vis.filter(t=>overdue(t)),
    myqueue:all.filter(t=>canApprove(u,t)) };
  let dashboards=loadDashboards();
  if(!state.dashId||!dashboards.find(d=>d.id===state.dashId)) state.dashId=dashboards[0].id;
  let dash=dashboards.find(d=>d.id===state.dashId);
  let editing=false;
  root.innerHTML="";
  const head=el(`<div class="section-h"><h2>Dashboards</h2><div class="rule"></div>
    <select id="dsel" style="width:auto">${dashboards.map(d=>`<option value="${d.id}" ${d.id===state.dashId?"selected":""}>${esc(d.name)}</option>`).join("")}</select>
    <button class="btn sm ghost" id="dnew">+ New</button>
    <button class="btn sm ghost" id="dedit">Edit</button></div>`);
  root.appendChild(head);
  const toolbar=el(`<div id="dtools"></div>`); root.appendChild(toolbar);
  const grid=el(`<div class="dash-grid"></div>`); root.appendChild(grid);
  $("#dsel",head).onchange=e=>{ state.dashId=e.target.value; renderShell(); };
  $("#dnew",head).onclick=()=>{ const name=prompt("New dashboard name:","My dashboard"); if(!name)return; const nd={id:"d_"+Math.random().toString(36).slice(2,8),name,widgets:["kpi_open","kpi_pending","kpi_overdue","chart_status"]}; dashboards=[...dashboards,nd]; saveDashboards(dashboards); state.dashId=nd.id; renderShell(); };
  const renderGrid=()=>{ grid.innerHTML="";
    (dash.widgets||[]).forEach((wt,idx)=>{ const w=WIDGETS[wt]; if(!w)return;
      const card=el(`<div class="dash-w size-${w.size}"><div class="dw-h"><span>${esc(w.label)}</span>${editing?'<button class="dw-x" title="Remove widget">✕</button>':''}</div><div class="dw-body"></div></div>`);
      if(editing) $(".dw-x",card).onclick=()=>{ dash.widgets.splice(idx,1); saveDashboards(dashboards); renderGrid(); };
      try{ w.render($(".dw-body",card),ctx); }catch(e){ $(".dw-body",card).innerHTML='<div class="muted">—</div>'; }
      grid.appendChild(card);
    });
    if(!(dash.widgets||[]).length) grid.appendChild(el(`<div class="empty" style="grid-column:1/-1">No widgets yet — click <b>Edit</b>, then add some.</div>`));
  };
  const renderTools=()=>{ toolbar.innerHTML=""; if(!editing)return;
    const bar=el(`<div class="card" style="margin-bottom:14px"><div class="code muted" style="margin-bottom:10px">ADD A WIDGET</div><div id="wadd" style="display:flex;gap:8px;flex-wrap:wrap"></div>
      <div style="display:flex;gap:8px;margin-top:12px;border-top:1px solid var(--line);padding-top:12px"><button class="btn sm ghost" id="dren">Rename</button><button class="btn sm danger" id="ddel">Delete dashboard</button></div></div>`);
    const wa=$("#wadd",bar);
    WIDGET_ORDER.forEach(k=>{ const b=el(`<button class="btn sm">+ ${esc(WIDGETS[k].label)}</button>`); b.onclick=()=>{ dash.widgets=[...(dash.widgets||[]),k]; saveDashboards(dashboards); renderGrid(); }; wa.appendChild(b); });
    $("#dren",bar).onclick=()=>{ const n=prompt("Rename dashboard:",dash.name); if(n){ dash.name=n; saveDashboards(dashboards); renderShell(); } };
    $("#ddel",bar).onclick=()=>{ if(dashboards.length<=1){toast("Keep at least one dashboard.");return;} if(!confirm("Delete this dashboard?"))return; dashboards=dashboards.filter(d=>d.id!==dash.id); saveDashboards(dashboards); state.dashId=dashboards[0].id; renderShell(); };
    toolbar.appendChild(bar);
  };
  $("#dedit",head).onclick=()=>{ editing=!editing; $("#dedit",head).classList.toggle("on",editing); $("#dedit",head).textContent=editing?"Done":"Edit"; renderTools(); renderGrid(); };

/* ============================ BOARD (Jira-like) ============================ */
async function viewBoard(root){
  root.innerHTML=`<div class="empty">Loading…</div>`;
  const all=await db.listTickets(),u=state.user; const base=visibleTickets(all,u);
  root.innerHTML=""; let scope="mine";
  const bar=el(`<div class="section-h"><h2>Board</h2><div class="rule"></div>
    <div class="seg" id="scope"><button class="seg-btn on" data-sc="mine">Assigned to me</button><button class="seg-btn" data-sc="all">All</button></div>
    <div class="searchbar"><input id="q" placeholder="Search ref, subject…"/></div>
    <select id="fd" style="width:auto"><option value="">All departments</option>${depts().map(d=>`<option>${esc(d)}</option>`).join("")}</select></div>`);
  root.appendChild(bar);
  const hint=el(`<div class="board-hint" style="margin:-6px 0 10px"></div>`); root.appendChild(hint);
  const holder=el(`<div class="board vert"></div>`); root.appendChild(holder);
  async function onDrop(sk){ const t=DRAG; DRAG=null; if(!t||t.status===sk) return;
    const allowed=allowedTransitions(u,t);
    if(u.role!=="admin" && !allowed.includes(sk)){ toast(t.status==="pending_approval"?"Open the ticket and approve it to move it out of Pending Approval.":"That move isn't allowed for your role."); return; }
    t.status=sk; t.activity.unshift({at:now(),by:u.id,byName:u.displayName,text:"Status → "+STATUS[sk].label+" (board)"}); t.updatedAt=now();
    await db.saveTicket(t); notifyWebhook("ticket.status_changed",t); toast(`${t.ref} → ${STATUS[sk].label}`); draw(); }
  const draw=()=>{
    const q=$("#q",bar).value.toLowerCase(),fd=$("#fd",bar).value;
    let rows=base.filter(t=>(!fd||t.department===fd)&&(!q||[t.ref,t.subject,t.requesterName,...(t.labels||[])].join(" ").toLowerCase().includes(q)));
    if(scope==="mine") rows=rows.filter(t=>t.assigneeId===u.id);
    hint.innerHTML= scope==="mine"
      ? "Tickets assigned to you, grouped by stage. Drag a card to change its stage; Pending Approval moves only when approved."
      : "All tickets you can see, grouped by stage.";
    holder.innerHTML="";
    if(scope==="mine" && !rows.length){ holder.innerHTML='<div class="empty">No tickets are assigned to you yet. Switch to <b>All</b> to see the full board, or open a ticket and assign it.</div>'; return; }
    BOARD.forEach(sk=>{
      const items=rows.filter(t=>t.status===sk);
      const col=el(`<div class="col"><h4>${esc(STATUS[sk].label)}<span class="cnt">${items.length}</span></h4><div class="col-cards"></div></div>`);
      col.ondragover=e=>{e.preventDefault();col.classList.add("drop-over");};
      col.ondragleave=()=>col.classList.remove("drop-over");
      col.ondrop=e=>{e.preventDefault();col.classList.remove("drop-over");onDrop(sk);};
      const cc=$(".col-cards",col);
      items.forEach(t=>{ const od=overdue(t);
        const c=el(`<div class="tcard"><div class="k">${esc(t.ref)}</div><div class="s">${esc(t.subject)}</div>
          <div style="margin-bottom:8px">${pri(t.priority)} <span class="muted" style="font-size:11px">${esc(t.type)}</span></div>
          ${(t.labels||[]).map(l=>`<span class="lbl">${esc(l)}</span>`).join("")}
          ${t.due?`<div style="font-size:11px;margin-top:6px" class="${od?'overdue':'muted'}">${od?'⚠ overdue · ':'due '}${dueTxt(t)}</div>`:""}
          <div class="foot" style="margin-top:8px"><span class="muted" style="font-size:11px">${esc(t.department||"")} · ${ago(t.createdAt)}</span>${t.assigneeName?`<span class="avatar" title="${esc(t.assigneeName)}">${initials(t.assigneeName)}</span>`:`<span class="muted" style="font-size:11px">unassigned</span>`}</div></div>`);
        c.draggable=true; c.ondragstart=()=>{DRAG=t;c.classList.add("dragging");}; c.ondragend=()=>c.classList.remove("dragging"); c.onclick=()=>openTicket(t.id); cc.appendChild(c);
      });
      if(!items.length) cc.appendChild(el(`<div class="muted" style="font-size:12px;padding:2px">—</div>`));
      holder.appendChild(col);
    });
  };
  $$("[data-sc]",bar).forEach(b=>b.onclick=()=>{scope=b.dataset.sc;$$("[data-sc]",bar).forEach(x=>x.classList.toggle("on",x===b));draw();});
  $("#q",bar).oninput=draw; $("#fd",bar).onchange=draw; draw();
}


function ticketTable(rows){
  if(!rows.length) return el(`<div class="table-wrap"><div class="empty">No tickets here yet.</div></div>`);
  const wrap=el(`<div class="table-wrap"><table><thead><tr><th>Ref</th><th>Subject</th><th>Type</th><th>Dept</th><th>Priority</th><th>Assignee</th><th>Age</th><th>Status</th><th></th></tr></thead><tbody></tbody></table></div>`);
  const tb=$("tbody",wrap);
  rows.forEach(t=>{const tr=el(`<tr><td class="mono" style="color:var(--cyan)">${esc(t.ref)}</td><td>${esc(t.subject)}${overdue(t)?' <span class="overdue" style="font-size:11px">⚠</span>':''}</td><td class="muted">${esc(t.type)}</td><td class="muted">${esc(t.department||"—")}</td><td>${pri(t.priority)}</td><td>${t.assigneeName?esc(t.assigneeName):'<span class="muted">—</span>'}</td><td class="muted">${ago(t.createdAt)}</td><td>${statusBadge(t)}</td><td><button class="btn sm ghost">Open</button></td></tr>`);$("button",tr).onclick=()=>openTicket(t.id);tb.appendChild(tr);});
  return wrap;
}

function viewFlow(root){
  root.innerHTML="";
  root.appendChild(el(`<div class="section-h"><h2>Ticket lifecycle</h2><div class="rule"></div></div>`));
  const pill=(k)=>{const m=STATUS[k]||{label:k,c:"#8FA6C4"};return `<span class="rstep" style="border-color:${m.c}66;color:${m.c}">${esc(m.label)}</span>`;};
  const spine=["new","pending_approval","assigned","in_progress","resolved","closed"];
  root.appendChild(el(`<div class="card"><div class="route-chain" style="margin-bottom:12px">${spine.map(pill).join('<span class="rarrow">→</span>')}</div>
    <div class="flow-legend">
      <span class="flow-branch">↳ From <b style="color:${STATUS.pending_approval.c}">Pending Approval</b>, a rejection goes to ${pill("rejected")}.</span>
      <span class="flow-branch">↳ <b style="color:${STATUS.in_progress.c}">In Progress</b> can move to ${pill("escalated")} or ${pill("pending_requester")} and back.</span>
      <span class="flow-branch">↳ The requester can ${pill("cancelled")} before work starts, or reopen a ${pill("resolved")} ticket.</span>
      <span class="flow-branch">↳ Ticket types with <b>no approval</b> skip Pending Approval and start at ${pill("assigned")}.</span>
    </div></div>`));
  const bar=el(`<div class="section-h"><h2>Routing by ticket type</h2><div class="rule"></div>
    <div class="searchbar"><input id="q" placeholder="Search type or department…"/></div>
    <select id="fc" style="width:auto"><option value="">All categories</option>${cats().map(c=>`<option>${esc(c)}</option>`).join("")}</select></div>`);
  root.appendChild(bar);
  const holder=el(`<div></div>`); root.appendChild(holder);
  const draw=()=>{ const q=$("#q",bar).value.toLowerCase(), fc=$("#fc",bar).value; holder.innerHTML="";
    (fc?[fc]:cats()).forEach(cat=>{
      const rows=ACTIVE_MATRIX.filter(m=>m.cat===cat && (!q||[m.type,m.dept].join(" ").toLowerCase().includes(q)));
      if(!rows.length) return;
      holder.appendChild(el(`<div class="code muted" style="margin:16px 0 8px">${esc(cat)}</div>`));
      rows.forEach(m=>{
        const steps=[`<span class="rstep me">Requester</span>`];
        if(m.approvers.length){ m.approvers.forEach(r=>steps.push(`<span class="rstep">${esc(ROLE_LABEL[r]||r)}</span>`)); } else { steps.push(`<span class="rstep none">No approval</span>`); }
        steps.push(`<span class="rstep dept">${esc(m.dept)}</span>`);
        const tag=m.approvers.length>1?'<span class="lbl" style="color:var(--amber);border-color:var(--amber);background:color-mix(in srgb,var(--amber) 12%,transparent)">dual approval</span>':(m.approvers.length?'':'<span class="lbl" style="color:var(--green);border-color:var(--green);background:color-mix(in srgb,var(--green) 12%,transparent)">auto-route</span>');
        holder.appendChild(el(`<div class="card" style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px"><b>${esc(m.type)}</b>${tag}</div><div class="route-chain">${steps.join('<span class="rarrow">→</span>')}</div></div>`));
      });
    });
    if(!holder.children.length) holder.appendChild(el(`<div class="empty">No matching ticket types.</div>`));
  };
  $("#q",bar).oninput=draw; $("#fc",bar).onchange=draw; draw();
}

let chatWith=null;
async function viewMessages(root){
  const u=state.user; root.innerHTML="";
  const others=(state.users||[]).filter(x=>x.id!==u.id);
  root.appendChild(el(`<div class="section-h"><h2>Messages</h2><div class="rule"></div><span class="muted code" style="font-size:11px">Direct chat with anyone on ${esc(state.settings.appName)}</span></div>`));
  const layout=el(`<div class="chat-layout"><div class="chat-side"><input id="cs" placeholder="Search people…" style="margin-bottom:8px"/><div id="ppl"></div></div><div class="chat-main" id="cmain"></div></div>`);
  root.appendChild(layout);
  const ppl=$("#ppl",layout);
  const paintPeople=(q)=>{ ppl.innerHTML=""; others.filter(x=>!q||(x.displayName||"").toLowerCase().includes(q.toLowerCase())||(x.email||"").toLowerCase().includes(q.toLowerCase())).forEach(x=>{
      const row=el(`<div class="chat-person ${chatWith&&chatWith.id===x.id?'on':''}"><span class="avatar">${initials(x.displayName||x.email||"?")}</span><div style="min-width:0"><b style="font-size:13px">${esc(x.displayName||"—")}</b><div class="muted" style="font-size:11px"><span class="pdot ${isActive(x)?'online':'offline'}"></span>${esc(ROLE_LABEL[x.role]||x.role)} · ${isActive(x)?'Active':'Offline'}</div></div></div>`);
      row.onclick=()=>{ chatWith=x; paintPeople($("#cs",layout).value); openConv(); }; ppl.appendChild(row);
    }); if(!ppl.children.length) ppl.appendChild(el(`<div class="empty" style="padding:14px">No people</div>`)); };
  $("#cs",layout).oninput=e=>paintPeople(e.target.value);
  const cmain=$("#cmain",layout);
  async function openConv(){
    if(state._chatPoll){clearInterval(state._chatPoll);state._chatPoll=null;}
    if(!chatWith){ cmain.innerHTML=`<div class="empty" style="padding:44px">Select a person to start chatting.</div>`; return; }
    const cid=convId(u.id,chatWith.id);
    cmain.innerHTML=`<div class="chat-head"><span class="avatar">${initials(chatWith.displayName||"?")}</span><div><b>${esc(chatWith.displayName||"—")}</b><div class="muted" style="font-size:11px"><span class="pdot ${isActive(chatWith)?'online':'offline'}"></span>${isActive(chatWith)?'Active now':'Offline'} · ${esc(ROLE_LABEL[chatWith.role]||chatWith.role)}</div></div></div><div class="chat-body" id="cbody"></div><div class="chat-input"><input id="ci" placeholder="Message ${esc((chatWith.displayName||'').split(' ')[0]||'')}…" autocomplete="off"/><button class="btn primary" id="cbtn">Send</button></div>`;
    const body=$("#cbody",cmain); let lastLen=-1;
    const load=async()=>{ let msgs; try{ msgs=await db.listMessages(cid); }catch(e){ return; } if(msgs.length===lastLen)return; lastLen=msgs.length;

async function buildNotifications(u){
  let all=[]; try{ all=await db.listTickets(); }catch(e){ return []; }
  const out=[]; const seen=new Set();
  all.forEach(t=>{ if(canApprove(u,t)){ out.push({text:`${t.ref} awaits your approval`,ticketId:t.id,at:t.updatedAt}); seen.add(t.id);} });
  all.forEach(t=>{ if(t.assigneeId===u.id && overdue(t) && !seen.has(t.id)){ out.push({text:`${t.ref} is overdue`,ticketId:t.id,at:t.updatedAt}); seen.add(t.id);} });
  all.forEach(t=>{ if(t.requesterId===u.id && ["resolved","approved","denied"].includes(t.status) && !seen.has(t.id)){ out.push({text:`${t.ref} was ${STATUS[t.status]?STATUS[t.status].label:t.status}`,ticketId:t.id,at:t.updatedAt}); seen.add(t.id);} });
  if(u.role==="admin"){ try{ const us=await db.listUsers(); us.filter(x=>x.status==="pending").forEach(x=>out.push({text:(x.displayName||x.email)+" requests access",ticketId:"__accounts__",at:now()})); }catch(e){} }
  out.sort((a,b)=>a.at<b.at?1:-1); return out.slice(0,12);
}

/* ---- command palette (⌘K / Ctrl-K): jump to tabs, new ticket, search tickets ---- */
async function openPalette(){
  if(!state.user || $("#cmdp")) return;
  const root=$("#modal-root");
  const ov=el(`<div class="overlay" id="cmdp" style="align-items:flex-start;padding-top:12vh"><div class="cmdp"><input id="cq" placeholder="Search tickets or jump to…  (Esc to close)" autocomplete="off"/><div class="cmd-list" id="cl"></div></div></div>`);
  root.appendChild(ov); const close=()=>ov.remove(); ov.onclick=e=>{if(e.target===ov)close();};
  const actions=[{type:"nav",label:"New ticket",id:"new"}].concat(tabsForRole(state.user.role).map(t=>({type:"nav",label:"Go to "+t.label,id:t.id})));
  let tickets=[], items=[], sel=0;
  const render=(q)=>{ q=(q||"").toLowerCase();
    const acts=actions.filter(a=>a.label.toLowerCase().includes(q));
    const tks=(q?tickets.filter(t=>[t.ref,t.subject,t.requesterName].join(" ").toLowerCase().includes(q)):tickets.slice(0,5))
      .slice(0,8).map(t=>({type:"ticket",label:t.ref+" · "+t.subject,id:t.id,sub:(STATUS[t.status]?STATUS[t.status].label:t.status)}));
    items=[...acts,...tks]; if(sel>=items.length)sel=Math.max(0,items.length-1);
    const cl=$("#cl",ov);
    cl.innerHTML=items.length?items.map((it,i)=>`<div class="cmd-item ${i===sel?'sel':''}" data-i="${i}"><span>${it.type==='nav'?'→ ':''}${esc(it.label)}</span>${it.sub?`<span class="muted" style="font-size:11px">${esc(it.sub)}</span>`:''}</div>`).join(""):'<div class="empty" style="padding:16px">No matches</div>';
    $$(".cmd-item",cl).forEach(d=>{ d.onmouseenter=()=>{sel=+d.dataset.i;mark();}; d.onclick=()=>go(items[+d.dataset.i]); });
  };
  const mark=()=>$$(".cmd-item",ov).forEach((d,i)=>d.classList.toggle("sel",i===sel));
  const go=(it)=>{ if(!it)return; close(); if(it.type==="nav"){ state.tab=it.id; renderShell(); } else { openTicket(it.id); } };
  const inp=$("#cq",ov);
  inp.oninput=()=>{ sel=0; render(inp.value); };
  inp.onkeydown=(e)=>{ if(e.key==="ArrowDown"){e.preventDefault();sel=Math.min(items.length-1,sel+1);mark();} else if(e.key==="ArrowUp"){e.preventDefault();sel=Math.max(0,sel-1);mark();} else if(e.key==="Enter"){e.preventDefault();go(items[sel]);} else if(e.key==="Escape"){close();} };
  render(""); inp.focus();
  try{ tickets=await db.listTickets(); render(inp.value); }catch(e){}
}

  root.appendChild(head);
  const body=el(`<div></div>`); root.appendChild(body);
  const bar=el(`<div style="max-width:820px;margin-top:20px;display:flex;justify-content:flex-end;gap:10px;align-items:center"><span class="muted code" style="font-size:11px">Branding · Priorities · Labels · SLA save together</span><button class="btn primary" id="sv">Save settings</button></div>`);
  root.appendChild(bar);

  function listEditor(title,arr,on){const box=el(`<div class="card" style="max-width:700px;margin-bottom:16px"><div class="code muted" style="margin-bottom:10px">${title}</div><div class="chip-row" id="ch"></div><div style="display:flex;gap:8px;margin-top:12px"><input id="a" placeholder="Add…"/><button class="btn sm">Add</button></div></div>`);const ch=$("#ch",box);const paint=()=>{ch.innerHTML="";arr.forEach((v,i)=>{const c=el(`<span class="chip">${esc(v)}<button>✕</button></span>`);$("button",c).onclick=()=>{arr.splice(i,1);paint();on(arr);};ch.appendChild(c);});};$("button",box).onclick=()=>{const inp=$("#a",box),v=inp.value.trim();if(v){arr.push(v);inp.value="";paint();on(arr);}};paint();return box;}

  function matrixCard(container){
    const mtxCard=el(`<div class="card" style="max-width:820px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:10px;flex-wrap:wrap">
        <div class="code muted">ROUTING MATRIX (CUSTOMIZABLE)</div>
        <div><button class="btn sm ghost" id="mreset">Reset to default</button> <button class="btn sm" id="madd">+ Add type</button></div></div>
      <div class="table-wrap"><table><thead><tr><th>Category</th><th>Type</th><th>Approval</th><th>Addressed by</th><th></th></tr></thead><tbody id="mtb"></tbody></table></div>
      <div class="matrix-note">Editing changes how new tickets route and who must approve them. Existing tickets keep the rule captured when submitted.</div></div>`);
    container.appendChild(mtxCard);
    const paintMtx=()=>{ const tb=$("#mtb",mtxCard); tb.innerHTML="";
      ACTIVE_MATRIX.forEach((m,i)=>{ const tr=el(`<tr><td class="muted">${esc(m.cat)}</td><td>${esc(m.type)}</td><td>${m.approvers.length?m.approvers.map(r=>ROLE_LABEL[r]).join(" + "):'<span class="muted">none</span>'}</td><td class="muted">${esc(m.dept)}</td><td style="white-space:nowrap"><button class="btn sm ghost" data-a="e">Edit</button> <button class="btn sm danger" data-a="d">✕</button></td></tr>`);
        $('[data-a="e"]',tr).onclick=()=>matrixRowModal(i,paintMtx);
        $('[data-a="d"]',tr).onclick=async()=>{ if(!confirm(`Remove "${m.type}"?`))return; ACTIVE_MATRIX.splice(i,1); await persistMatrix(); paintMtx(); toast("Type removed"); };
        tb.appendChild(tr); });
    };
    $("#madd",mtxCard).onclick=()=>matrixRowModal(-1,paintMtx);
    $("#mreset",mtxCard).onclick=async()=>{ if(!confirm("Reset the routing matrix to the built-in default?"))return; ACTIVE_MATRIX=cloneMatrix(DEFAULT_MATRIX); await persistMatrix(); paintMtx(); toast("Matrix reset to default"); };
    paintMtx();
  }

  function secBranding(r){
    const c=el(`<div class="card" style="max-width:700px">
      <div class="row-2"><div class="field"><label>App name</label><input id="n" value="${esc(s.appName)}"/></div><div class="field"><label>Tagline</label><input id="tg" value="${esc(s.tagline)}"/></div></div>
      <div class="row-2"><div class="field"><label>Accent color</label><input id="ac" type="color" value="${esc(s.accent)}" style="height:42px;padding:4px"/></div>
        <div class="field"><label>Default theme (new devices)</label><select id="th"><option value="dark" ${s.defaultTheme==="dark"?"selected":""}>Dark</option><option value="light" ${s.defaultTheme==="light"?"selected":""}>Light</option></select></div></div></div>`);
    r.appendChild(c);
    $("#n",c).oninput=e=>s.appName=e.target.value;
    $("#tg",c).oninput=e=>s.tagline=e.target.value;
    $("#ac",c).oninput=e=>{s.accent=e.target.value;document.documentElement.style.setProperty("--accent",e.target.value);};
    $("#th",c).onchange=e=>{s.defaultTheme=e.target.value;applyTheme(e.target.value);};
  }
  function secWorkflow(r){ r.appendChild(listEditor("PRIORITY LEVELS",s.priorities,a=>s.priorities=a)); r.appendChild(listEditor("LABELS",s.labels,a=>s.labels=a)); }
  function secSLA(r){
    const c=el(`<div class="card" style="max-width:700px"><div class="code muted" style="margin-bottom:6px">SLA TARGETS · HOURS TO DUE</div>
      <div class="muted" style="font-size:12px;margin-bottom:14px">New tickets get a due date automatically from their priority (unless the requester picks one). Overdue tickets flag red on the board and lists. Leave blank for no auto-due.</div>
      <div id="slrows" class="grid" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))"></div></div>`);
    r.appendChild(c); const box=$("#slrows",c);
    (s.priorities||[]).forEach(p=>{ const v=(s.sla[p]!=null?s.sla[p]:""); const f=el(`<div class="field"><label>${esc(p)}</label><input type="number" min="1" value="${esc(v)}" placeholder="— none —"/></div>`); $("input",f).oninput=(e)=>{ const n=parseInt(e.target.value,10); if(n>0)s.sla[p]=n; else delete s.sla[p]; }; box.appendChild(f); });
  }
  function secAssistant(r){ r.appendChild(aiSettingsCard()); r.appendChild(el(`<div class="muted" style="font-size:12px;margin-top:8px;max-width:700px">The AI key is stored on this device only and saves immediately — it isn't part of the shared settings above.</div>`)); }
  function secData(r){
    const c=el(`<div class="card" style="max-width:700px"><div class="code muted" style="margin-bottom:12px">DATA MANAGEMENT</div>
      <div style="display:flex;flex-wrap:wrap;gap:10px">
        <button class="btn" id="csv">Export tickets (CSV)</button>
        <button class="btn" id="expj">Export settings (JSON)</button>
        <button class="btn" id="impj">Import settings (JSON)</button>
        <button class="btn danger" id="rst">Reset settings</button>
        <input type="file" id="imf" accept="application/json" style="display:none"/></div>
      <div class="muted" style="font-size:12px;margin-top:12px">Export tickets for Excel / Power BI / audit. Settings JSON moves branding, priorities, labels, SLA, and the routing matrix between deployments. Reset restores defaults (routing matrix is kept).</div></div>`);
    r.appendChild(c);
    $("#csv",c).onclick=async()=>{ const rows=await db.listTickets(); download("clientpulse-tickets.csv", toCSV(rows), "text/csv"); toast(`Exported ${rows.length} tickets`); };
    $("#expj",c).onclick=()=>{ const out={...s,matrix:cloneMatrix(ACTIVE_MATRIX)}; download("clientpulse-settings.json", JSON.stringify(out,null,2), "application/json"); toast("Settings exported"); };
    $("#impj",c).onclick=()=>$("#imf",c).click();
    $("#imf",c).onchange=(e)=>{ const f=e.target.files[0]; if(!f)return; const rd=new FileReader(); rd.onload=async()=>{ try{ const p=JSON.parse(rd.result); await db.saveSettings(p); state.settings=p; syncMatrix(p); applyAccent(); toast("Settings imported"); renderShell(); }catch(x){ toast("Invalid settings file"); } }; rd.readAsText(f); };
    $("#rst",c).onclick=async()=>{ if(!confirm("Reset branding, priorities, labels, and SLA to defaults? The routing matrix is kept."))return; const d=JSON.parse(JSON.stringify(DEFAULT_SETTINGS)); d.matrix=cloneMatrix(ACTIVE_MATRIX); await db.saveSettings(d); state.settings=d; applyAccent(); toast("Settings reset"); renderShell(); };
  }


  function secIntegrations(r){
    r.innerHTML=""; if(!s.intake)s.intake={category:"",type:"",priority:"Medium"};
    const schema=`{
  "type": "object",
  "properties": {
    "event": { "type": "string" }, "at": { "type": "string" }, "app": { "type": "string" },
    "ticket": { "type": "object", "properties": {
      "ref": { "type": "string" }, "subject": { "type": "string" },
      "category": { "type": "string" }, "type": { "type": "string" },
      "priority": { "type": "string" }, "status": { "type": "string" },
      "department": { "type": "string" }, "requesterName": { "type": "string" },
      "assigneeName": { "type": "string" }, "due": { "type": "string" } } }
  }
}`;
    // ---- outbound webhook (app -> flow) ----
    const c=el(`<div class="card" style="max-width:730px"><div class="code muted" style="margin-bottom:8px">OUTBOUND WEBHOOK · APP → FLOW</div>
      <div class="muted" style="font-size:12px;margin-bottom:14px">Paste the <b>HTTP POST URL</b> from a Copilot Studio / Power Automate <i>"When a HTTP request is received"</i> trigger. The app POSTs an event when a ticket is <b>created</b> or changes <b>stage</b>.</div>
      <div class="field"><label>HTTP POST URL</label><input id="wh" placeholder="https://…/triggers/manual/paths/invoke?…" value="${esc(s.webhookUrl||"")}"/></div>
      <div style="display:flex;gap:8px;margin-top:4px"><button class="btn" id="wtest">Send test event</button><span class="muted" id="wm" style="font-size:11px;align-self:center;flex:1"></span></div>
      <pre style="white-space:pre;overflow:auto;font-family:var(--code);font-size:11px;background:var(--inset-bg);border:1px solid var(--line);border-radius:8px;padding:12px;margin:12px 0 0">${esc(schema)}</pre></div>`);
    r.appendChild(c);
    $("#wh",c).oninput=e=>s.webhookUrl=e.target.value.trim();
    $("#wtest",c).onclick=()=>{ const url=$("#wh",c).value.trim(),m=$("#wm",c); if(!url){m.textContent="Enter the HTTP POST URL first.";return;}
      try{ fetch(url,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({event:"ticket.test",at:now(),app:s.appName||"ClientPulse",ticket:{ref:"TEST-000",subject:"Test event",category:"—",type:"—",priority:"Medium",status:"new",department:"—",requesterName:state.user.displayName,assigneeName:"",due:""}})}).then(()=>{m.textContent="Sent — check the flow run history.";}).catch(()=>{m.textContent="Sent (opaque response; check the flow).";});
      }catch(e){m.textContent="Could not send: "+e.message;} };

    // ---- email intake (Outlook -> flow -> app) ----
    const rest=`https://firestore.googleapis.com/v1/projects/${esc(FIREBASE_CONFIG.projectId||"YOUR_PROJECT_ID")}/databases/(default)/documents/inbox?key=${esc(FIREBASE_CONFIG.apiKey||"YOUR_WEB_API_KEY")}`;
    const body=`{
  "fields": {
    "subject": { "stringValue": "@{triggerOutputs()?['body/subject']}" },
    "body":    { "stringValue": "@{triggerOutputs()?['body/bodyPreview']}" },
    "from":    { "stringValue": "@{triggerOutputs()?['body/from']}" },
    "secret":  { "stringValue": "YOUR_SHARED_SECRET" }
  }
}`;
    const rules=`match /inbox/{doc} {
  allow create: if request.resource.data.secret == "YOUR_SHARED_SECRET";
  allow read, delete: if request.auth != null;
  allow update: if false;
}`;
    const box=el(`<div class="card" style="max-width:730px;margin-top:14px"><div class="code muted" style="margin-bottom:8px">EMAIL INTAKE · OUTLOOK → FLOW → TICKET</div>
      <div class="muted" style="font-size:12px;margin-bottom:14px">A Power Automate flow fires on a new Outlook email, writes it to a Firestore <code>inbox</code> collection, and ClientPulse auto-creates a ticket (checked on load and every ~45s). ${db.isFirebase()?'':'<b style="color:var(--amber)">Requires Firebase mode — add your config to enable.</b>'}</div>
      <div class="row-3"><div class="field"><label>Default category</label><select id="ic"></select></div><div class="field"><label>Default type</label><select id="it"></select></div><div class="field"><label>Priority</label><select id="ip">${(s.priorities||[]).map(p=>`<option ${p===s.intake.priority?"selected":""}>${esc(p)}</option>`).join("")}</select></div></div>
      <div style="display:flex;gap:8px;margin-top:4px"><button class="btn" id="cknow" ${db.isFirebase()?"":"disabled"}>Check inbox now</button><span class="muted" style="font-size:11px;align-self:center;flex:1">Tickets from email are tagged <b>email</b>.</span></div>
      <div class="code muted" style="margin:16px 0 6px">1 · POWER AUTOMATE — HTTP action (after the Outlook trigger)</div>
      <div class="muted" style="font-size:11px;margin-bottom:4px">Method <b>POST</b> · URI:</div><pre class="intake-pre">${esc(rest)}</pre>
      <div class="muted" style="font-size:11px;margin:8px 0 4px">Headers: <code>Content-Type: application/json</code> · Body:</div><pre class="intake-pre">${esc(body)}</pre>
      <div class="code muted" style="margin:16px 0 6px">2 · FIRESTORE SECURITY RULE (add to your rules)</div><pre class="intake-pre">${esc(rules)}</pre>
      <div class="muted" style="font-size:11px;margin-top:8px">The shared secret is a light gate (it lives in your rules and flow, not exposed to app users). For stricter security, call Firestore with a Google service-account token instead of the secret — ask and I'll give those steps.</div></div>`);
    r.appendChild(box);
    const ic=$("#ic",box),it=$("#it",box),ip=$("#ip",box);
    ic.innerHTML=cats().map(x=>`<option ${x===s.intake.category?"selected":""}>${esc(x)}</option>`).join("");
    if(!s.intake.category)s.intake.category=cats()[0];
    const fillT=()=>{ it.innerHTML=typesForCat(ic.value).map(x=>`<option ${x===s.intake.type?"selected":""}>${esc(x)}</option>`).join(""); if(!typesForCat(ic.value).includes(s.intake.type))s.intake.type=typesForCat(ic.value)[0]; };
    ic.value=s.intake.category||cats()[0]; fillT();
    ic.onchange=()=>{s.intake.category=ic.value;s.intake.type="";fillT();s.intake.type=it.value;};
    it.onchange=()=>s.intake.type=it.value; ip.onchange=()=>s.intake.priority=ip.value;
    $("#cknow",box).onclick=async()=>{ $("#cknow",box).disabled=true; await drainInbox(); toast("Inbox checked"); $("#cknow",box).disabled=false; };
  }
  const secs={branding:secBranding,workflow:secWorkflow,flow:secFlow,sla:secSLA,assistant:secAssistant,data:secData,integrations:secIntegrations};
  const draw=()=>{ $$("[data-s]",head).forEach(b=>b.classList.toggle("active",b.dataset.s===tab)); body.innerHTML=""; secs[tab](body); };
  $$("[data-s]",head).forEach(b=>b.onclick=()=>{tab=b.dataset.s;draw();});
  $("#sv",bar).onclick=async()=>{ s.appName=(s.appName||"").trim()||"ClientPulse"; s.matrix=cloneMatrix(ACTIVE_MATRIX); await db.saveSettings(s); state.settings=s; applyAccent(); if(!localStorage.getItem(THEME_KEY))applyTheme(s.defaultTheme); toast("Settings saved"); renderShell(); };
  draw();
}

/* ============================ ISA CHATBOT ============================ */
const chat={open:false,msgs:[]};
const aiCfg=()=>readLS(AI_KEY,{provider:"none",model:"",key:""});
function aiSettingsCard(){
  const cfg=aiCfg();
  const box=el(`<div class="card" style="max-width:700px;margin-top:6px"><div class="code muted" style="margin-bottom:4px">ISA AI CONNECTION</div>
    <div class="muted" style="font-size:12px;margin-bottom:12px">Powers free-form answers in the ISA chat. The key is stored <b>on this device only</b> — never in the shared database. Without a key, ISA still answers from live ticket data.</div>
    <div class="field"><label>Provider</label><select id="p"><option value="none" ${cfg.provider==="none"?"selected":""}>Local assistant (no key)</option><option value="anthropic" ${cfg.provider==="anthropic"?"selected":""}>Anthropic (Claude)</option><option value="groq" ${cfg.provider==="groq"?"selected":""}>Groq (Llama)</option></select></div>
    <div class="row-2"><div class="field"><label>Model (optional)</label><input id="mo" value="${esc(cfg.model||"")}" placeholder="claude-3-5-haiku-20241022 / llama-3.3-70b-versatile"/></div><div class="field"><label>API key</label><input id="k" type="password" value="${esc(cfg.key||"")}" placeholder="paste key"/></div></div>
    <div style="text-align:right"><button class="btn primary" id="sv">Save AI connection</button></div></div>`);
  $("#sv",box).onclick=()=>{writeLS(AI_KEY,{provider:$("#p",box).value,model:$("#mo",box).value.trim(),key:$("#k",box).value.trim()});toast("AI connection saved (this device)");if(chat.open)drawChatPanel();};
  return box;
}
function mountChat(){const root=$("#chat-root");root.innerHTML="";const l=el(`<button id="chat-launch" title="Ask ISA"><span class="ico">ISA</span></button>`);l.onclick=toggleChat;root.appendChild(l);if(chat.open)drawChatPanel();}
function toggleChat(){chat.open=!chat.open;if(chat.open){if(!chat.msgs.length)chat.msgs.push({who:"bot",text:greeting()});drawChatPanel();}else{const p=$("#chat-panel");if(p)p.remove();}}
function greeting(){const c=aiCfg();return `Hi ${state.user.displayName.split(" ")[0]}, I'm ISA — your BPO ticketing assistant.\nAsk about ticket status, your approval queue, routing, or how to use the board.${c.provider==="none"?"\n\n(Admins can connect an AI key in Settings for free-form answers.)":""}`;}
function drawChatPanel(){const root=$("#chat-root");let p=$("#chat-panel");if(p)p.remove();
  p=el(`<div id="chat-panel"><div class="ch-head"><span class="orb"></span><div><b>ISA</b><small>WFM ASSISTANT · ${aiCfg().provider==="none"?"LOCAL":aiCfg().provider.toUpperCase()}</small></div><div class="sp"></div><button id="ch-close">✕</button></div><div class="ch-body" id="ch-body"></div><div class="ch-quick" id="ch-quick"></div><div class="ch-input"><input id="ch-in" placeholder="Ask ISA…" autocomplete="off"/><button class="btn primary" id="ch-send">Send</button></div></div>`);
  root.appendChild(p); $("#ch-close",p).onclick=toggleChat; const body=$("#ch-body",p);
  chat.msgs.forEach(m=>body.appendChild(el(`<div class="ch-msg ${m.who}">${esc(m.text)}</div>`))); body.scrollTop=body.scrollHeight;
  const q=$("#ch-quick",p);["My approval queue","Open tickets","Who approves Termination?","How does routing work?"].forEach(x=>{const b=el(`<button>${x}</button>`);b.onclick=()=>sendChat(x);q.appendChild(b);});
  const send=()=>{const v=$("#ch-in",p).value.trim();if(v){$("#ch-in",p).value="";sendChat(v);}};$("#ch-send",p).onclick=send;$("#ch-in",p).onkeydown=e=>{if(e.key==="Enter")send();};$("#ch-in",p).focus();}
function pushMsg(who,text){chat.msgs.push({who,text});const b=$("#ch-body");if(b){b.appendChild(el(`<div class="ch-msg ${who}">${esc(text)}</div>`));b.scrollTop=b.scrollHeight;}}
async function sendChat(text){pushMsg("me",text);const b=$("#ch-body");const ty=el(`<div class="ch-typing" id="typing">ISA is thinking…</div>`);if(b){b.appendChild(ty);b.scrollTop=b.scrollHeight;}let r;try{r=await botReply(text);}catch(e){r="Local answer:\n\n"+await localReply(text);}$("#typing")?.remove();pushMsg("bot",r);}
async function botReply(text){const c=aiCfg();if(c.provider!=="none"&&c.key){try{return await callAI(text,c);}catch(e){return await localReply(text);}}return await localReply(text);}
async function localReply(text){const q=text.toLowerCase(),u=state.user;const all=await db.listTickets();
  const open=all.filter(t=>!["closed","cancelled","rejected"].includes(t.status));const queue=all.filter(t=>canApprove(u,t));const mine=all.filter(t=>t.requesterId===u.id);
  if(/^(hi|hello|hey|help)/.test(q))return greeting()+"\n\nTry: “my approval queue”, “open tickets”, “who approves <type>”, “how does routing work”.";
  if(/queue|approve|awaiting|to approve/.test(q)){if(u.role==="agent")return "As a requester you don't approve tickets — you raise them and track progress on the Board.";if(!queue.length)return "Your approval queue is clear.";return `${queue.length} awaiting you:\n`+queue.slice(0,8).map(t=>`• ${t.ref} — ${t.subject} (${t.type})`).join("\n");}
  if(/my (ticket|request)/.test(q)){if(!mine.length)return "You haven't raised any tickets yet.";return `You've raised ${mine.length}:\n`+mine.slice(0,8).map(t=>`• ${t.ref} — ${t.subject} — ${STATUS[t.status].label}`).join("\n");}
  if(/open|pending|outstanding/.test(q)){const byD={};open.forEach(t=>byD[t.department]=(byD[t.department]||0)+1);return `Open: ${open.length}.\n`+Object.entries(byD).map(([d,n])=>`• ${d}: ${n}`).join("\n");}
  if(/who approve|approval for|routes|routing|route/.test(q)){const hit=ACTIVE_MATRIX.find(m=>q.includes(m.type.toLowerCase().split(" ")[0]));if(hit)return `${hit.type}: approval → ${hit.approvers.length?hit.approvers.map(r=>ROLE_LABEL[r]).join(" + "):"none"}; addressed by ${hit.dept}.`;return "Routing follows the Ticketing System v2 matrix: category → type sets the approver role(s) and the department. Termination needs HR + Ops Director; Reporting needs no approval. Admins can reroute any ticket.";}
  if(/reroute|wrong department|correct dept/.test(q))return "Open the ticket → Reroute (admin). Pick the right category/type; the department and required approvals reset automatically. Attachment analysis suggests a department when it can.";
  if(/attach|file|upload|analy/.test(q))return "Attach files on New Ticket or the Files tab. Spreadsheets/CSVs are analyzed in-browser (sheets, rows, columns) and ISA suggests a routing department from the content.";
  const t=all.find(x=>q.includes(x.ref.toLowerCase()));if(t)return `${t.ref} — ${t.subject}\nStatus: ${STATUS[t.status].label} · Dept: ${t.department||"—"} · Type: ${t.type}`;
  return "I can help with approvals, open tickets, routing, and attachments. Try “my approval queue” or a ref like TKT-1001.";
}
async function callAI(text,cfg){const all=await db.listTickets();const u=state.user;const open=all.filter(t=>!["closed","cancelled","rejected"].includes(t.status)).length;const queue=all.filter(t=>canApprove(u,t)).length;
  const ctx=`You are ISA, assistant in a BPO WFM ticketing console. Be concise and practical. User: ${u.displayName} (${ROLE_LABEL[u.role]}). Workflow: category→type routing matrix sets approver role(s) and department; lifecycle New→Triage→Pending Approval→Assigned→In Progress→Resolved→Closed. Live: total ${all.length}, open ${open}, awaiting this user ${queue}. Recent: ${all.slice(0,8).map(t=>`${t.ref}:${t.subject}[${STATUS[t.status].label}]`).join("; ")||"none"}.`;
  if(cfg.provider==="anthropic"){const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"content-type":"application/json","x-api-key":cfg.key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model:cfg.model||"claude-3-5-haiku-20241022",max_tokens:600,system:ctx,messages:[{role:"user",content:text}]})});const d=await r.json();if(d.error)throw new Error(d.error.message);return (d.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("\n")||"(no response)";}
  if(cfg.provider==="groq"){const r=await fetch("https://api.groq.com/openai/v1/chat/completions",{method:"POST",headers:{"content-type":"application/json","authorization":"Bearer "+cfg.key},body:JSON.stringify({model:cfg.model||"llama-3.3-70b-versatile",messages:[{role:"system",content:ctx},{role:"user",content:text}]})});const d=await r.json();if(d.error)throw new Error(d.error.message);return d.choices?.[0]?.message?.content||"(no response)";}
  throw new Error("Unknown provider");
}

/* ============================ BOOT ============================ */
async function boot(){ state.settings=await db.getSettings(); syncMatrix(state.settings); applyTheme(currentTheme()); applyAccent(); route(); }
(async function main(){
  try{ initTheme(); initParticles(); bootSequence(); await initBackend(); state.settings=await db.getSettings(); syncMatrix(state.settings); applyTheme(currentTheme()); state.user=await db.currentUser(); applyAccent(); route(); }
  catch(e){ console.error(e); $("#app").innerHTML=`<div class="auth"><div class="auth-card"><div class="msg err">Startup error: ${esc(e.message)}</div></div></div>`; }
})();

</script>
